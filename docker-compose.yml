services:

  # ── Langfuse — self-hosted agent observability ─────────────────────────────
  langfuse-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: super-secret-dev-key-change-in-prod
      NEXTAUTH_URL: http://localhost:3000
      SALT: dev-salt-change-in-prod
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      TELEMETRY_ENABLED: "false"

  # ── LiteLLM DB — enables the /ui dashboard ────────────────────────────────
  litellm-db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      - litellm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── LiteLLM — unified LLM proxy (Ollama + GitHub Models) ──────────────────
  # network_mode: host lets LiteLLM reach Ollama on localhost:11434
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      litellm-db:
        condition: service_healthy
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: --config /app/config.yaml --port 4000 --detailed_debug
    environment:
      # Database for /ui dashboard
      DATABASE_URL: postgresql://litellm:litellm@localhost:5433/litellm
      # Master key — used by /ui for login
      LITELLM_MASTER_KEY: cycleway-dev-key
      # Langfuse connection for tracing (localhost because host network)
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-placeholder}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-placeholder}
      LANGFUSE_HOST: http://localhost:3000
      # Optional: GitHub Models free inference
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

volumes:
  langfuse-db:
  litellm-db:
