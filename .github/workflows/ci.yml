name: CycleWay CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate source files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check HTML structure
        run: |
          echo "Checking index.html..."
          grep -q 'type="module"' cycleway/index.html && echo "✅ ES modules present"
          grep -q 'id="map"'     cycleway/index.html && echo "✅ Map element present"
          grep -q 'id="aiBlock"' cycleway/index.html && echo "✅ AI advisor block present"

      - name: Check JS modules exist
        run: |
          for f in config utils geocoding routing weather traffic scoring map ui app assistant; do
            [ -f "cycleway/js/$f.js" ] && echo "✅ $f.js" || (echo "❌ Missing $f.js" && exit 1)
          done

      - name: Check spec-kit docs
        run: |
          [ -f "specs/001-cycleway-navigator/spec.md" ]         && echo "✅ spec.md"
          [ -f "specs/001-cycleway-navigator/plan.md" ]         && echo "✅ plan.md"
          [ -f ".specify/memory/constitution.md" ]              && echo "✅ constitution.md"

      - name: Validate LiteLLM config
        run: |
          python3 -c "import yaml; yaml.safe_load(open('litellm-config.yaml'))" && echo "✅ litellm-config.yaml is valid YAML"

      - name: Validate docker-compose
        run: |
          python3 -c "import yaml; yaml.safe_load(open('docker-compose.yml'))" && echo "✅ docker-compose.yml is valid YAML"

      - name: Check Ollama assistant module
        run: |
          grep -q "OLLAMA_URL\|LiteLLM\|litellm\|localhost:4000" cycleway/js/assistant.js \
            && echo "✅ LLM endpoint configured in assistant.js" \
            || echo "⚠️  assistant.js using direct Ollama (no LiteLLM proxy)"

  lint:
    name: Lint JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ESLint
        run: npm install -g eslint
      - name: Check for syntax errors
        run: |
          for f in cycleway/js/*.js; do
            node --input-type=module < "$f" 2>/dev/null \
              && echo "✅ $f" \
              || echo "⚠️  $f — check imports (expected when run outside server)"
          done

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r cycleway/* _site/
          cp -r exam-prep  _site/exam-prep/
          # Patch assistant.js for Pages (no local Ollama — note only, app still works)
          echo "<!-- Deployed via GitHub Actions -->" >> _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
