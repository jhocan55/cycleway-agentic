model_list:
  # Local Ollama — free, no key needed
  - model_name: local/llama3.2
    litellm_params:
      model: ollama/llama3.2:1b
      api_base: http://localhost:11434

  # GitHub Models — free tier (GPT-4o mini, Llama, Phi)
  # Set GITHUB_TOKEN env var to enable
  - model_name: github/gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: https://models.inference.ai.azure.com
      api_key: os.environ/GITHUB_TOKEN

  - model_name: github/llama-3.3-70b
    litellm_params:
      model: openai/meta-llama-3.3-70b-instruct
      api_base: https://models.inference.ai.azure.com
      api_key: os.environ/GITHUB_TOKEN

# Langfuse observability (traces every LLM call)
litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

general_settings:
  master_key: "cycleway-dev-key"
